# Thresholds for strategy confidence and other parameters
thresholds:
  # Minimum confidence required for a signal to be considered actionable.
  # Recommended range for intraday strategies is 0.05‑0.20.
  min_confidence: 0.08

# -------------------------------------------------
# Intraday screening thresholds
# Recommended ranges:
#   min_screener_score: 0.01 – 0.20   (higher values make screening stricter)
#   min_volume:          1,000 – 5,000 (adjust based on market liquidity)
#   min_price:           1 – 20      (₹) – lower bound for penny‑stock exclusion
intraday:
  # Minimum screener/ML score a candidate must achieve to be considered.
  min_screener_score: 0.01
  # Minimum traded volume (shares) for the candidate.
  min_volume: 2000
  # Minimum last price (₹) for the candidate.
  min_price: 5

# -------------------------------------------------
# F&O (Futures & Options) screening thresholds
# Recommended ranges:
#   min_screener_score: 0.00 – 0.15
#   min_volume:          5,000 – 20,000
#   min_price:           10 – 100
fno:
  # Minimum screener/ML score for F&O candidates.
  min_screener_score: 0.0
  # Minimum traded volume for non‑index F&O symbols.
  min_volume: 10000
  # Minimum last price (₹) for non‑index F&O symbols.
  min_price: 10
