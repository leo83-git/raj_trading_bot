# Quant Trading System Configuration

broker:
  type: zerodha  # Primary broker for trading

paper_trade: true  # allow_after_market_paper_trading: false  # After-market trading is now permanently disabled - use daily reporting instead

# Optional brokers (set enabled: true to use)
angelone_enabled: false  # Set to true to enable Angel One broker
zerodha_enabled: true  # Set to true to enable Zerodha broker

zerodha_api_key: "yzxs1h7v1q6e02mp"
zerodha_api_secret: "q5gscgpji7mcegockwypo628esiuclhj"

# Timeout settings
timeout:
  quote: 10  # seconds - increased for reliability under load
  historical: 10
  option_chain: 8
  option_chain_pipeline: 8  # hard limit for one F&O chain lookup
  greeks: 30  # Greeks calculation is compute-intensive

retry:
  max_attempts: 5  # increased for NSE rate limiting resilience
  backoff_factor: 2

processing:
  # Timeout (in seconds) for the overall F&O pipeline execution.
  # Adjust based on expected data volume and network latency.
  # Reduced timeout to avoid long‑running F&O tasks that never return.
  # The per‑stock chain fetch already has a 15 s hard timeout, so a total of
  # 120 s for the whole batch is sufficient for most realistic workloads.
  fno_pipeline_timeout: 120
  # Timeout for intraday pipeline processing per batch (seconds).
  intraday_pipeline_timeout: 120
  # F&O Batch Processing Configuration
  fno_batch_size: 8              # Number of symbols to process per batch
  fno_max_concurrent: 3          # Maximum number of batches to run concurrently
  fno_task_timeout_seconds: 120  # Per-symbol timeout within batch processing

scheduler:
  enabled: false
  scan_interval_seconds: 60
  manage_interval_seconds: 15
  loop_sleep_seconds: 1
cache:
  enabled: true
  ttl_quote: 15  # seconds, increased for reliability
  ttl_option_chain: 60  # 1 minute
  ttl_greeks: 30  # 30 seconds

capital:
  base_capital: 300000
  max_capital_per_trade: 100000
  risk_per_trade: 0.02

# Watchlist with trading categories
