name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run live integration tests (set to "true" to enable)'
        required: false
        default: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q tests/test_p7_observability.py

      - name: Run integration and regression tests
        run: python -m pytest -q

      - name: Compile changed P7 modules
        run: python -m py_compile analytics/performance.py analytics/tracker/__init__.py alerts/alert_manager.py quant_utils/logger.py core/database.py main.py
