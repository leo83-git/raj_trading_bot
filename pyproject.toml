[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raj-trading-bot"
version = "0.0.0"
description = "raj_trading_bot workspace tooling and trading utilities"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
